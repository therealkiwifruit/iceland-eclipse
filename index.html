<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sarra - Eclipse 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Replaced Italiana with Cormorant Garamond for the elegant Title, kept Jost for the body -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================
     1. DESIGN TOKENS & CORE RESET
  ============================================ */
  :root {
    --void: #030106;        
    --corona: #f2c879;      
    --ember: #ff8a5b;       
    --starlight: #eef0f7;   
    --muted: #8f8a97;       
    --hairline: rgba(238, 240, 247, 0.12);
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  html { 
    scroll-behavior: smooth; 
    width: 100%;
    overflow-x: hidden;
    background-color: var(--void); /* Set to pitch black base */
  }

  body {
    color: var(--starlight);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    min-height: 100vh;
  }

  ::selection { 
    background: var(--corona); 
    color: var(--void); 
  }

  /* ============================================
     2. DYNAMIC PARALLAX SKY BACKGROUND
  ============================================ */
  .sky-parallax-container {
    position: fixed;
    top: -15vh; /* Expanded to allow scroll-parallax headroom */
    left: -10vw;
    width: 120vw;
    height: 130vh;
    background-color: var(--void);
    overflow: hidden;
    z-index: 0; 
    pointer-events: none;
    perspective: 1000px;
  }

  /* This overlay fades in/out via JS to dynamically brighten the sky when the sun flares */
  .sky-light-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(20, 10, 40, 0.8) 0%, rgba(35, 15, 60, 0.4) 60%, transparent 100%);
    opacity: var(--bg-flare, 1);
    transition: opacity 0.1s linear;
    z-index: 0;
  }

  .parallax-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Transition keeps mouse movement smooth */
    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform;
    z-index: 1;
  }

  /* Integrated scroll-y into the transform math for mobile parallax */
  .layer-background { transform: translate3d(calc(var(--mx, 0) * 10px), calc(var(--my, 0) * 10px - var(--scroll-y, 0) * 0.05px), 0); }
  .layer-midground { transform: translate3d(calc(var(--mx, 0) * 25px), calc(var(--my, 0) * 25px - var(--scroll-y, 0) * 0.15px), 0); }
  .layer-foreground { transform: translate3d(calc(var(--mx, 0) * 45px), calc(var(--my, 0) * 45px - var(--scroll-y, 0) * 0.35px), 0); }

  /* 
     STAR REFINEMENT: 
     Wrapper handles translation offsets & glow.
     Core is pure intense white (#ffffff).
  */
  .star-glow-container {
    position: absolute;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 4px currentColor);
  }

  .star-refined {
    width: 100%;
    height: 100%;
    background-color: #ffffff; /* Intense pure white center */
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
  }
  
  .star-size-tiny { width: 3.5px; height: 3.5px; }
  .star-size-capped { width: 6.5px; height: 6.5px; }

  .anim-fast-flicker { animation: fastFlicker 0.9s infinite ease-in-out; }
  .anim-slow-glow { animation: slowGlow 4.5s infinite ease-in-out; }

  /* Added translate(-50%, -50%) to perfectly center the star on its coordinates for bridge drawing */
  @keyframes fastFlicker {
    0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
    50% { opacity: 1.0; transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes slowGlow {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
    50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.05); }
  }

  /* ============================================
     3. MAIN FOREGROUND CONTENT WRAPPER
  ============================================ */
  .site-content {
    position: relative;
    z-index: 10; 
  }

  /* Reduced height to close the huge gap before the gallery */
  .hero-wrap {
    position: relative;
    height: 140vh;
  }

  .hero-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent; 
  }

  .eclipse-system {
    position: relative;
    width: min(42vmin, 320px);
    height: min(42vmin, 320px);
    margin-bottom: clamp(28px, 5vh, 52px);
  }

  /* 
     SAMSUNG INTERNET FIX: 
     Multi-tier box-shadow instead of radial-gradient. 
     Creates a 100% safe, beautiful white-to-orange-to-red corona glow.
  */
  .sun {
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    background-color: #ffffff; /* Bright white core */
    box-shadow: 
        0 0 10px 2px #ffffff,
        0 0 25px 8px #f2c879,
        0 0 45px 15px #ff8a5b,
        0 0 70px 20px rgba(128, 32, 0, 0.6);
  }

  /* Custom Lens Flare / Diamond Ring */
  .lens-flare {
    position: absolute;
    top: 50%; left: 50%;
    width: 250vw; /* Massive width for the streak */
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,200,150,0.05) 35%, rgba(255,255,255,0.8) 50%, rgba(255,200,150,0.05) 65%, transparent 100%);
    transform: translate(-50%, -50%) rotate(-15deg) scale(var(--flare-op, 1));
    opacity: var(--flare-op, 1);
    pointer-events: none;
    mix-blend-mode: screen;
    will-change: transform, opacity;
  }
  
  /* Central starburst of the lens flare */
  .lens-flare::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,200,100,0.4) 20%, transparent 60%);
    transform: translate(-50%, -50%);
  }

  .moon {
    position: absolute;
    inset: -2px; 
    border-radius: 50%;
    background-color: #030106;
    /* Soft ambient rim lighting to make it look 3D and realistic */
    box-shadow: inset -10px -10px 20px rgba(255, 255, 255, 0.05);
    will-change: transform;
    transform: translate3d(0px, 0px, 0); 
  }

  .hero-text {
    text-align: center;
    padding: 0 24px;
    opacity: calc(1 - var(--fade-text, 0));
    will-change: opacity;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.5rem, 12vw, 7rem);
    font-weight: 400;
    letter-spacing: 0.05em;
    line-height: 1;
    color: var(--starlight);
  }

  .tagline {
    margin-top: 16px;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* Moved up and slightly larger */
  .scroll-cue {
    position: absolute;
    bottom: 60px; /* Shifted higher for mobile */
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: calc(1 - var(--fade-text, 0) * 3);
    color: var(--muted);
  }

  .scroll-cue span {
    font-size: 0.75rem; /* Increased size */
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .scroll-cue .line {
    width: 1px;
    height: 32px;
    background: linear-gradient(var(--muted), transparent);
    animation: dropline 1.8s ease-in-out infinite;
  }

  @keyframes dropline {
    0%, 100% { transform: scaleY(0.3); transform-origin: top; opacity: 0.4; }
    50% { transform: scaleY(1); transform-origin: top; opacity: 1; }
  }

  /* ============================================
     4. GALLERY & CONTENT LAYERS
  ============================================ */

  /* Removed grey background so stars are visible everywhere */
  .gallery {
    background: transparent; 
    padding: clamp(40px, 8vh, 80px) clamp(20px, 5vw, 48px) 40px;
  }

  .duo {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 48px) clamp(40px, 8vh, 76px);
    display: flex;
    gap: 22px;
  }

  .duo .frame { flex: 1; margin-bottom: 0; }
  .duo .frame.mirror { transform: translateY(24px) scaleX(-1); }
  .duo .frame.mirror.visible { transform: translateY(0) scaleX(-1); }

  .gallery-grid {
    columns: 3 300px;
    column-gap: 22px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .frame {
    break-inside: avoid;
    margin-bottom: 22px;
    border-radius: 10px;
    overflow: hidden;
    background: #1a1720;
    border: 1px solid var(--hairline);
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .frame.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
    cursor: zoom-in;
  }

  .frame:not(.frame--empty):hover {
    border-color: rgba(242, 200, 121, 0.4);
    box-shadow: 0 0 0 1px rgba(242, 200, 121, 0.15), 0 18px 40px rgba(0, 0, 0, 0.45);
    transform: translateY(-3px);
  }

  .frame--empty {
    aspect-ratio: var(--ar, 3/4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    border-style: dashed;
  }

  .frame--empty svg { opacity: 0.5; }
  .frame--empty span { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; }

  footer {
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 60px 24px 80px;
  }

  /* ============================================
     5. LIGHTBOX OVERLAY
  ============================================ */

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(3, 1, 6, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
    padding: 40px;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 82vh;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
  }

  .lightbox figcaption {
    text-align: center;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute;
    background: transparent;
    border: none;
    color: var(--starlight);
    font-family: 'Jost', sans-serif;
    font-size: 1.6rem;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { opacity: 1; }
  .lightbox-close { top: 24px; right: 32px; font-size: 1.8rem; }
  .lightbox-prev { left: clamp(12px, 3vw, 40px); top: 50%; transform: translateY(-50%); font-size: 2.4rem; }
  .lightbox-next { right: clamp(12px, 3vw, 40px); top: 50%; transform: translateY(-50%); font-size: 2.4rem; }

  /* ============================================
     6. RESPONSIVE & ACCESSIBILITY
  ============================================ */

  @media (max-width: 640px) {
    .duo { flex-direction: column; }
    .gallery-grid { columns: 1 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .parallax-layer { transition: none !important; transform: none !important; }
    .star-glow-container { animation: none !important; opacity: 0.8 !important; }
    .frame { transition: none !important; }
    .scroll-cue .line { animation: none !important; }
  }
</style>
</head>
<body>

  <!-- BACKGROUND PARALLAX LAYER CONTAINER -->
  <div class="sky-parallax-container">
      <div class="sky-light-overlay"></div>
      <div class="parallax-layer layer-background"></div>
      <div class="parallax-layer layer-midground"></div>
      <div class="parallax-layer layer-foreground"></div>
  </div>

  <!-- FOREGROUND CONTENT WRAPPER -->
  <main class="site-content">
    
    <section class="hero-wrap" id="heroWrap">
      <div class="hero-sticky" id="heroSticky">
        <div class="eclipse-system">
          
          <div class="sun"></div>
          <div class="lens-flare" id="lensFlare"></div>
          <div class="moon" id="moon"></div>
          
        </div>
        
        <div class="hero-text">
          <p class="eyebrow">Iceland &middot; 2026</p>
          <h1 class="title">Sarra</h1>
          <p class="tagline">totality, and everything after</p>
        </div>
        
        <div class="scroll-cue">
          <span>Scroll</span>
          <div class="line"></div>
        </div>
      </div>
    </section>

    <section class="gallery">
      <div class="duo">
        <div class="frame"><img src="images/duo-left.jpg" alt="" loading="lazy"></div>
        <div class="frame mirror"><img src="images/duo-right.jpg" alt="" loading="lazy"></div>
      </div>
    </section>

    <section class="gallery">
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <footer>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="11.5" stroke="#8f8a97" stroke-width="1"/>
        <circle cx="13" cy="13" r="6" fill="#8f8a97"/>
      </svg>
    </footer>

  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lightbox-prev" id="lbPrev" aria-label="Previous photo">&lsaquo;</button>
    <figure>
      <img id="lbImg" src="" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lightbox-next" id="lbNext" aria-label="Next photo">&rsaquo;</button>
  </div>

<script>
  /* ============================================
     PHOTO CONFIGURATION
  ============================================ */
  const photos = [
    { src: "images/photo-01.jpg", caption: "" },
    { src: "images/photo-02.jpg", caption: "" },
    { src: "images/photo-03.jpg", caption: "" },
    { src: "images/photo-04.jpg", caption: "" },
    { src: "images/photo-05.jpg", caption: "" },
    { src: "images/photo-06.jpg", caption: "" },
    { src: "images/photo-07.jpg", caption: "" },
    { src: "images/photo-08.jpg", caption: "" },
    { src: "images/photo-09.jpg", caption: "" },
    { src: "images/photo-10.jpg", caption: "" },
    { src: "images/photo-11.jpg", caption: "" },
    { src: "images/photo-12.jpg", caption: "" },
    { src: "images/photo-13.jpg", caption: "" },
    { src: "images/photo-14.jpg", caption: "" },
    { src: "images/photo-15.jpg", caption: "" },
    { src: "images/photo-16.jpg", caption: "" },
    { src: "images/photo-17.jpg", caption: "" },
    { src: "images/photo-18.jpg", caption: "" }
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================
     DYNAMIC DENSITY STARFIELD & BRIDGES
  ============================================ */
  function buildStarfield() {
    const densityMultiplier = Math.max(0.5, window.innerWidth / 900);
    const isDesktop = window.innerWidth > 768;

    const layers = [
      { selector: '.layer-background', count: Math.floor(70 * densityMultiplier), sizeClass: 'star-size-capped', animClass: 'anim-slow-glow', bridges: Math.floor(15 * densityMultiplier) },
      { selector: '.layer-midground', count: Math.floor(70 * densityMultiplier), sizeClass: 'star-size-tiny', animClass: 'anim-fast-flicker', bridges: Math.floor(10 * densityMultiplier) },
      { selector: '.layer-foreground', count: Math.floor(35 * densityMultiplier), sizeClass: 'star-size-tiny', animClass: 'anim-fast-flicker', bridges: 0 }
    ];

    const starColors = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#e0ecff', '#ffebd6', '#ffd0b3'];

    layers.forEach(layer => {
      const container = document.querySelector(layer.selector);
      if (!container) return;
      
      const frag = document.createDocumentFragment();
      const coords = [];
      
      for (let i = 0; i < layer.count; i++) {
        const starWrapper = document.createElement('div');
        starWrapper.className = `star-glow-container ${layer.sizeClass} ${layer.animClass}`;
        
        const left = (Math.random() * 100);
        const top = (Math.random() * 100);
        const delay = (Math.random() * 4).toFixed(2);
        const color = starColors[Math.floor(Math.random() * starColors.length)];
        
        starWrapper.style.cssText = `left: ${left.toFixed(2)}%; top: ${top.toFixed(2)}%; animation-delay: ${delay}s; color: ${color};`;
        
        const starCore = document.createElement('div');
        starCore.className = 'star-refined';
        
        starWrapper.appendChild(starCore);
        frag.appendChild(starWrapper);
        coords.push({x: left, y: top});
      }
      
      if (layer.bridges > 0) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; pointer-events: none;';
        
        let drawnLines = 0;
        for(let i = 0; i < coords.length; i++) {
            for(let j = i + 1; j < coords.length; j++) {
                let dx = coords[i].x - coords[j].x;
                let dy = coords[i].y - coords[j].y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 3 && dist < 12 && Math.random() > 0.75) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    // Perfect alignment achieved!
                    line.setAttribute("x1", coords[i].x + "%");
                    line.setAttribute("y1", coords[i].y + "%");
                    line.setAttribute("x2", coords[j].x + "%");
                    line.setAttribute("y2", coords[j].y + "%");
                    line.setAttribute("stroke", "rgba(255, 255, 255, 0.15)");
                    line.setAttribute("stroke-width", isDesktop ? "0.5" : "1");
                    svg.appendChild(line);
                    drawnLines++;
                }
                if (drawnLines >= layer.bridges) break;
            }
            if (drawnLines >= layer.bridges) break;
        }
        frag.appendChild(svg);
      }
      
      container.appendChild(frag);
    });
  }
  
  buildStarfield();

  /* ============================================
     PARALLAX (MOUSE + SCROLL)
  ============================================ */
  let pTicking = false;
  if (!reduceMotion) {
    document.addEventListener('mousemove', (e) => {
      if (!pTicking) {
        window.requestAnimationFrame(() => {
          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;
          const moveX = (e.clientX - centerX) / centerX;
          const moveY = (e.clientY - centerY) / centerY;
          const container = document.querySelector('.sky-parallax-container');
          
          if(container) {
            container.style.setProperty('--mx', moveX);
            container.style.setProperty('--my', moveY);
          }
          pTicking = false;
        });
        pTicking = true;
      }
    });
  }

  /* ============================================
     3-PART CINEMATIC ECLIPSE TRANSIT
  ============================================ */
  const root = document.documentElement;
  const moon = document.getElementById('moon');
  const heroWrap = document.getElementById('heroWrap');
  let sTicking = false;

  function updateEclipse() {
    sTicking = false;
    const scrollY = window.scrollY;
    
    // Inject scroll position into CSS for mobile parallax tracking
    root.style.setProperty('--scroll-y', scrollY);

    if (reduceMotion) {
      moon.style.transform = `translate3d(0px, 0px, 0)`; 
      return; 
    }
    
    // Map scroll perfectly to the height of the hero section
    const totalScroll = heroWrap.offsetHeight - window.innerHeight;
    const p = totalScroll > 0 ? Math.min(1, Math.max(0, scrollY / totalScroll)) : 0;
    
    let moonX, moonY, flareOp, bgFlare;
    const maxOffset = window.innerWidth <= 640 ? 150 : 250;

    if (p <= 0.2) { 
        // PHASE 1 (0.0 to 0.2): Land offset with Flare, slide into Totality
        let localP = p / 0.2; 
        moonX = -15 * (1 - localP); 
        moonY = -8 * (1 - localP);  
        flareOp = 1 - localP;       
        bgFlare = 1 - localP;       
    } else { 
        // PHASE 2 & 3 (0.2 to 1.0): Slide away, ignite flare, reveal sun completely
        let localP = (p - 0.2) / 0.8; 
        moonX = localP * maxOffset; 
        moonY = localP * (maxOffset * 0.4); 
        
        if (localP < 0.15) {
            flareOp = localP / 0.15; 
        } else {
            // Sun is huge and bright, so we leave a persistent ambient flare of 0.3
            flareOp = Math.max(0.3, 1 - ((localP - 0.15) / 0.3)); 
        }
        bgFlare = flareOp; 
    }

    // Apply calculated variables to DOM
    root.style.setProperty('--flare-op', flareOp.toFixed(3));
    root.style.setProperty('--bg-flare', bgFlare.toFixed(3));
    
    const textFade = Math.min(1, scrollY / 300);
    root.style.setProperty('--fade-text', textFade.toFixed(3));
    
    moon.style.transform = `translate3d(${moonX}px, ${moonY}px, 0)`;
  }

  window.addEventListener('scroll', () => {
    if (!sTicking) {
      window.requestAnimationFrame(updateEclipse);
      sTicking = true;
    }
  }, { passive: true });

  updateEclipse();

  /* ============================================
     GALLERY INJECTION & INTERSECTION OBSERVER
  ============================================ */
  const grid = document.getElementById('galleryGrid');
  const aspects = ['3/4', '1/1', '4/5', '4/3', '2/3'];
  const usingPlaceholders = photos.length === 0;
  const items = usingPlaceholders ? Array.from({ length: 6 }, () => null) : photos;

  items.forEach((photo, i) => {
    const frame = document.createElement('div');
    frame.className = 'frame' + (photo ? '' : ' frame--empty');

    if (photo) {
      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = photo.caption || 'A photo';
      img.loading = 'lazy';
      frame.appendChild(img);
      frame.addEventListener('click', () => openLightbox(i));
    } else {
      frame.style.setProperty('--ar', aspects[i % aspects.length]);
      frame.innerHTML = `
        <svg width="22" height="22" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="11.5" stroke="#8f8a97" stroke-width="1"/>
          <circle cx="13" cy="13" r="6" fill="#8f8a97"/>
        </svg>
        <span>awaiting</span>`;
    }
    grid.appendChild(frame);
  });

  if (reduceMotion) {
    document.querySelectorAll('.frame').forEach(f => f.classList.add('visible'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.frame').forEach(f => io.observe(f));
  }

  /* ============================================
     LIGHTBOX CONTROLLER
  ============================================ */
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCaption = document.getElementById('lbCaption');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');
  let currentIndex = 0;

  function openLightbox(index) {
    if (usingPlaceholders) return;
    currentIndex = index;
    showPhoto();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
  }

  function showPhoto() {
    const p = photos[currentIndex];
    lbImg.src = p.src;
    lbImg.alt = p.caption || '';
    lbCaption.textContent = p.caption || '';
    const multi = photos.length > 1;
    lbPrev.style.display = multi ? 'block' : 'none';
    lbNext.style.display = multi ? 'block' : 'none';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  lbPrev.addEventListener('click', () => { currentIndex = (currentIndex - 1 + photos.length) % photos.length; showPhoto(); });
  lbNext.addEventListener('click', () => { currentIndex = (currentIndex + 1) % photos.length; showPhoto(); });

  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbPrev.click();
    if (e.key === 'ArrowRight') lbNext.click();
  });

</script>
</body>
</html>
