<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Sarra - Eclipse 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================
     1. DESIGN TOKENS & CORE RESET
  ============================================ */
  :root {
    color-scheme: dark; 
    --void: #000000;        
    --corona: #f2c879;      
    --ember: #ff8a5b;       
    --starlight: #eef0f7;   
    --muted: #8f8a97;       
    --hairline: rgba(238, 240, 247, 0.12);
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  html { 
    scroll-behavior: smooth; 
    width: 100%;
    overflow-x: hidden;
    background-color: var(--void); 
  }

  body {
    color: var(--starlight);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    min-height: 100vh;
  }

  ::selection { 
    background: var(--corona); 
    color: var(--void); 
  }

  /* ============================================
     2. DYNAMIC PARALLAX SKY BACKGROUND
  ============================================ */
  .sky-parallax-container {
    position: fixed;
    top: -15vh; 
    left: -10vw;
    width: 120vw;
    height: 130vh;
    background-color: var(--void);
    overflow: hidden;
    z-index: 0; 
    pointer-events: none;
    perspective: 1000px;
  }

  /* Fades in with the sun flare */
  .sky-light-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(30, 15, 65, 0.9) 0%, rgba(20, 5, 35, 0.5) 60%, transparent 100%);
    opacity: var(--bg-flare, 0); 
    will-change: opacity;
    z-index: 0;
  }

  /* 
     AURORA BOREALIS CANVAS
     Sits safely behind the stars, blurred and dodged.
     Fades in via scroll tracking.
  */
  .aurora-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: blur(15px) drop-shadow(0 0 30px rgba(51,180,172,0.5));
    opacity: calc(var(--aurora-op, 0) * 0.85); /* Fades in smoothly */
    transform-origin: 0 100%;
    transform: skewX(-15deg);
    mix-blend-mode: screen;
    will-change: opacity;
    z-index: 0;
  }

  .parallax-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform;
    z-index: 1;
  }

  .layer-background { transform: translate3d(calc(var(--mx, 0) * 10px), calc(var(--my, 0) * 10px - var(--scroll-y, 0) * 0.05px), 0); }
  .layer-midground { transform: translate3d(calc(var(--mx, 0) * 25px), calc(var(--my, 0) * 25px - var(--scroll-y, 0) * 0.15px), 0); z-index: 2; }
  .layer-foreground { transform: translate3d(calc(var(--mx, 0) * 45px), calc(var(--my, 0) * 45px - var(--scroll-y, 0) * 0.35px), 0); z-index: 3; }

  .star-glow-container {
    position: absolute;
    will-change: transform, opacity;
  }

  .star-refined {
    width: 100%;
    height: 100%;
    background-color: #ffffff; 
    box-shadow: 0 0 2px #ffffff;
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
  }
  
  .star-size-tiny { width: 3.5px; height: 3.5px; }
  .star-size-capped { width: 6.5px; height: 6.5px; }

  .anim-fast-flicker { animation: fastFlicker 0.9s infinite ease-in-out; }
  .anim-slow-glow { animation: slowGlow 4.5s infinite ease-in-out; }

  @keyframes fastFlicker {
    0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
    50% { opacity: 1.0; transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes slowGlow {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
    50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.05); }
  }

  /* ============================================
     3. MAIN FOREGROUND CONTENT WRAPPER
  ============================================ */
  .site-content {
    position: relative;
    z-index: 10; 
  }

  .hero-wrap {
    position: relative;
    height: 120vh; 
  }

  .hero-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent; 
  }

  .eclipse-system {
    position: relative;
    width: min(45vmin, 340px);
    height: min(45vmin, 340px);
    /* INCREASED MARGIN: Pushes text safely below the Corona */
    margin-bottom: clamp(60px, 12vh, 120px); 
    z-index: 2;
  }

  .sun-canvas {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    pointer-events: none;
    mix-blend-mode: screen; 
  }

  .moon-canvas {
    position: absolute;
    inset: -1px; 
    width: calc(100% + 2px);
    height: calc(100% + 2px);
    will-change: transform;
    transform: translate3d(0, 0, 0); 
    pointer-events: none;
  }

  /* ============================================
     4. PHYSICS-ACCURATE LENS FLARE SYSTEM
  ============================================ */
  .flare-system {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 20;
    opacity: var(--flare-op, 0); 
    will-change: opacity;
  }

  .flare-artifact {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 9999px;
    will-change: transform;
    mix-blend-mode: screen;
  }

  .flare-burst {
    width: 0px; height: 0px;
    box-shadow: 0px 0px 30px 10px rgba(255,240,200,1), 0px 0px 10px 5px rgba(255,255,255,1);
    transform: translate(calc(-50% + var(--lx)), calc(-50% + var(--ly)));
  }

  .flare-streak {
    width: 150vw; height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,220,180,0.1) 40%, rgba(255,255,255,0.9) 50%, rgba(255,220,180,0.1) 60%, transparent 100%);
    transform: translate(calc(-50% + var(--lx)), calc(-50% + var(--ly))) rotate(-15deg);
  }

  .flare-1 {
    width: 100px; height: 100px;
    box-shadow: inset 0px 0px 20px 2px rgba(190,190,240,0.125), 0px 0px 20px 0px rgba(190,190,240,0.125);
    transform: translate(calc(-50% + var(--lx) * -0.5), calc(-50% + var(--ly) * -0.5));
  }
  .flare-2 {
    width: 200px; height: 200px;
    box-shadow: inset 0px 0px 100px 2px rgba(200,230,200,0.125), 0px 0px 13px 2px rgba(200,230,200,0.125);
    transform: translate(calc(-50% + var(--lx) * -1.2), calc(-50% + var(--ly) * -1.2));
  }
  .flare-3 {
    width: 600px; height: 600px;
    box-shadow: inset 0px 0px 22px 2px rgba(255,50,50,0.15), 0px 0px 13px 2px rgba(255,50,50,0.15);
    transform: translate(calc(-50% + var(--lx) * -2.2), calc(-50% + var(--ly) * -2.2));
  }
  .flare-4 {
    width: 100px; height: 100px;
    box-shadow: inset 0px 0px 160px 2px rgba(50,180,50,0.125), 0px 0px 20px 2px rgba(50,180,50,0.125);
    transform: translate(calc(-50% + var(--lx) * 0.8), calc(-50% + var(--ly) * 0.8));
  }
  .flare-5 {
    width: 60px; height: 60px;
    box-shadow: inset 0px 0px 160px 2px rgba(200,220,80,0.25), 0px 0px 20px 2px rgba(200,220,80,0.25);
    transform: translate(calc(-50% + var(--lx) * 0.3), calc(-50% + var(--ly) * 0.3));
  }
  .flare-6 {
    width: 20px; height: 20px;
    box-shadow: inset 0px 0px 18px 10px rgba(150,220,220,0.25), 0px 0px 5px 0px rgba(150,220,220,0.25);
    transform: translate(calc(-50% + var(--lx) * -0.2), calc(-50% + var(--ly) * -0.2));
  }

  /* ============================================
     5. TYPOGRAPHY & UI
  ============================================ */
  .hero-text {
    text-align: center;
    padding: 0 24px;
    opacity: calc(1 - var(--fade-text, 0));
    will-change: opacity;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .title {
    font-family: 'Jost', sans-serif;
    font-size: clamp(3.5rem, 11vw, 6.5rem);
    font-weight: 200; 
    letter-spacing: 0.15em; 
    line-height: 1;
    color: var(--starlight);
  }

  .tagline {
    margin-top: 16px;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* MOVED UP: Safe area for mobile browsers */
  .scroll-cue {
    position: absolute;
    bottom: clamp(60px, 12vh, 120px); 
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: calc(1 - var(--fade-text, 0) * 3);
    color: var(--muted);
  }

  .scroll-cue span {
    font-size: 0.75rem; 
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .scroll-cue .line {
    width: 1px;
    height: 32px;
    background: linear-gradient(var(--muted), transparent);
    animation: dropline 1.8s ease-in-out infinite;
  }

  @keyframes dropline {
    0%, 100% { transform: scaleY(0.3); transform-origin: top; opacity: 0.4; }
    50% { transform: scaleY(1); transform-origin: top; opacity: 1; }
  }

  /* ============================================
     6. GALLERY 
  ============================================ */
  .gallery {
    background: transparent; 
    padding: clamp(40px, 8vh, 80px) clamp(20px, 5vw, 48px) 40px;
  }

  .duo {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 48px) clamp(40px, 8vh, 76px);
    display: flex;
    gap: 22px;
  }

  .duo .frame { flex: 1; margin-bottom: 0; }
  .duo .frame.mirror { transform: translateY(24px) scaleX(-1); }
  .duo .frame.mirror.visible { transform: translateY(0) scaleX(-1); }

  .gallery-grid {
    columns: 3 300px;
    column-gap: 22px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .frame {
    break-inside: avoid;
    margin-bottom: 22px;
    border-radius: 10px;
    overflow: hidden;
    background: #1a1720;
    border: 1px solid var(--hairline);
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .frame.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
    cursor: zoom-in;
  }

  .frame:not(.frame--empty):hover {
    border-color: rgba(242, 200, 121, 0.4);
    box-shadow: 0 0 0 1px rgba(242, 200, 121, 0.15), 0 18px 40px rgba(0, 0, 0, 0.45);
    transform: translateY(-3px);
  }

  .frame--empty {
    aspect-ratio: var(--ar, 3/4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    border-style: dashed;
  }

  .frame--empty svg { opacity: 0.5; }
  .frame--empty span { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; }

  footer {
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 60px 24px 80px;
  }

  /* ============================================
     7. LIGHTBOX & ACCESSIBILITY
  ============================================ */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
    padding: 40px;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 82vh;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
  }

  .lightbox figcaption {
    text-align: center;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute;
    background: transparent;
    border: none;
    color: var(--starlight);
    font-family: 'Jost', sans-serif;
    font-size: 1.6rem;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { opacity: 1; }
  .lightbox-close { top: 24px; right: 32px; font-size: 1.8rem; }
  .lightbox-prev { left: clamp(12px, 3vw, 40px); top: 50%; transform: translateY(-50%); font-size: 2.4rem; }
  .lightbox-next { right: clamp(12px, 3vw, 40px); top: 50%; transform: translateY(-50%); font-size: 2.4rem; }

  @media (max-width: 640px) {
    .duo { flex-direction: column; }
    .gallery-grid { columns: 1 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .parallax-layer { transition: none !important; transform: none !important; }
    .star-glow-container { animation: none !important; opacity: 0.8 !important; }
    .aurora-canvas { display: none !important; }
    .frame { transition: none !important; }
    .scroll-cue .line { animation: none !important; }
  }
</style>
</head>
<body>

  <!-- BACKGROUND PARALLAX LAYER CONTAINER -->
  <div class="sky-parallax-container">
      <div class="sky-light-overlay"></div>
      <div class="parallax-layer layer-background"></div>
      
      <!-- NEW AURORA CANVAS (Rendered dynamically in JS) -->
      <canvas id="auroraCanvas" class="aurora-canvas"></canvas>
      
      <div class="parallax-layer layer-midground"></div>
      <div class="parallax-layer layer-foreground"></div>
  </div>

  <!-- FOREGROUND CONTENT WRAPPER -->
  <main class="site-content">
    
    <!-- PHYSICS-ACCURATE LENS FLARE SYSTEM -->
    <div class="flare-system" id="flareSystem">
        <div class="flare-artifact flare-streak"></div>
        <div class="flare-artifact flare-burst"></div>
        <div class="flare-artifact flare-1"></div>
        <div class="flare-artifact flare-2"></div>
        <div class="flare-artifact flare-3"></div>
        <div class="flare-artifact flare-4"></div>
        <div class="flare-artifact flare-5"></div>
        <div class="flare-artifact flare-6"></div>
    </div>

    <section class="hero-wrap" id="heroWrap">
      <div class="hero-sticky" id="heroSticky">
        <div class="eclipse-system">
          
          <!-- CANVAS RENDERED ECLIPSE -->
          <canvas id="sunCanvas" class="sun-canvas"></canvas>
          <canvas id="moonCanvas" class="moon-canvas" id="moon"></canvas>
          
        </div>
        
        <div class="hero-text">
          <p class="eyebrow">Iceland &middot; 2026</p>
          <h1 class="title">Sarra</h1>
          <p class="tagline">totality, and everything after</p>
        </div>
        
        <div class="scroll-cue">
          <span>Scroll</span>
          <div class="line"></div>
        </div>
      </div>
    </section>

    <section class="gallery">
      <div class="duo">
        <div class="frame"><img src="images/duo-left.jpg" alt="" loading="lazy"></div>
        <div class="frame mirror"><img src="images/duo-right.jpg" alt="" loading="lazy"></div>
      </div>
    </section>

    <section class="gallery">
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <footer>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="11.5" stroke="#8f8a97" stroke-width="1"/>
        <circle cx="13" cy="13" r="6" fill="#8f8a97"/>
      </svg>
    </footer>

  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lightbox-prev" id="lbPrev" aria-label="Previous photo">&lsaquo;</button>
    <figure>
      <img id="lbImg" src="" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lightbox-next" id="lbNext" aria-label="Next photo">&rsaquo;</button>
  </div>

<script>
  /* ============================================
     PHOTO CONFIGURATION
  ============================================ */
  const photos = [
    { src: "images/photo-01.jpg", caption: "" },
    { src: "images/photo-02.jpg", caption: "" },
    { src: "images/photo-03.jpg", caption: "" },
    { src: "images/photo-04.jpg", caption: "" },
    { src: "images/photo-05.jpg", caption: "" },
    { src: "images/photo-06.jpg", caption: "" },
    { src: "images/photo-07.jpg", caption: "" },
    { src: "images/photo-08.jpg", caption: "" },
    { src: "images/photo-09.jpg", caption: "" },
    { src: "images/photo-10.jpg", caption: "" },
    { src: "images/photo-11.jpg", caption: "" },
    { src: "images/photo-12.jpg", caption: "" },
    { src: "images/photo-13.jpg", caption: "" },
    { src: "images/photo-14.jpg", caption: "" },
    { src: "images/photo-15.jpg", caption: "" },
    { src: "images/photo-16.jpg", caption: "" },
    { src: "images/photo-17.jpg", caption: "" },
    { src: "images/photo-18.jpg", caption: "" }
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================
     CANVAS ECLIPSE GENERATOR
  ============================================ */
  function drawEclipseElements() {
      // 1. Draw The Glowing Sun (Corona)
      const sunCanvas = document.getElementById('sunCanvas');
      const sCtx = sunCanvas.getContext('2d');
      const sSize = 800; 
      sunCanvas.width = sSize;
      sunCanvas.height = sSize;

      const sCx = sSize / 2;
      const sCy = sSize / 2;
      const sGrad = sCtx.createRadialGradient(sCx, sCy, 0, sCx, sCy, sSize / 2);

      sGrad.addColorStop(0, '#ffffff');
      sGrad.addColorStop(0.48, '#ffffff'); 
      sGrad.addColorStop(0.505, '#ffffff'); 
      sGrad.addColorStop(0.54, '#f2d299');  
      sGrad.addColorStop(0.65, '#e67345');  
      sGrad.addColorStop(0.85, 'rgba(80, 15, 20, 0.4)'); 
      sGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      sCtx.fillStyle = sGrad;
      sCtx.fillRect(0, 0, sSize, sSize);

      // 2. Draw The Pitch Black Moon
      const moonCanvas = document.getElementById('moonCanvas');
      const mCtx = moonCanvas.getContext('2d');
      const mSize = 400; 
      moonCanvas.width = mSize;
      moonCanvas.height = mSize;
      const mCx = mSize / 2;
      const mCy = mSize / 2;
      const mRadius = (mSize / 2) - 2; 

      mCtx.beginPath();
      mCtx.arc(mCx, mCy, mRadius, 0, 2 * Math.PI);
      mCtx.fillStyle = '#010002'; 
      mCtx.fill();

      mCtx.beginPath();
      mCtx.arc(mCx - 2, mCy - 2, mRadius, 0, 2 * Math.PI);
      mCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      mCtx.lineWidth = 2;
      mCtx.stroke();
  }
  
  drawEclipseElements();

  /* ============================================
     DYNAMIC AURORA BOREALIS ENGINE
     Adapted from provided brush rendering
  ============================================ */
  function initAurora() {
    if (reduceMotion) return;

    const canvas = document.getElementById('auroraCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.globalCompositeOperation = "color-dodge";

    const isDesktop = window.innerWidth > 768;
    const BRUSH_COUNT = isDesktop ? 500 : 200; // Optimized brush count for devices
    
    let mouseXPercentage = 0.5;
    let mouseYPercentage = 0.5;

    // Aurora Colors derived exactly from Image 2
    const gradCtx = document.createElement('canvas').getContext('2d');
    
    // Vibrant Pink/Magenta -> Deep Purple
    const grad1 = gradCtx.createLinearGradient(window.innerWidth * .5, window.innerHeight, window.innerWidth * .35, 0);
    grad1.addColorStop(.3, "rgba(210, 60, 180, 0.9)");
    grad1.addColorStop(.7, "rgba(90, 40, 160, 0.4)");
    
    // Brilliant Cyan -> Deep Blue/Green
    const grad2 = gradCtx.createLinearGradient(window.innerWidth * .5, window.innerHeight * .5, window.innerWidth * .3, 0);
    grad2.addColorStop(.4, "rgba(0, 240, 190, 0.8)");
    grad2.addColorStop(.8, "rgba(20, 80, 140, 0.5)");

    // Define mathematical Curves
    const curves = [
        new Curve(canvas.width * .1, canvas.height * .9, .05, canvas.width * .8, canvas.height * .4, 1, BRUSH_COUNT, .8, grad1),
        new Curve(canvas.width * .25, canvas.height * .65, .33, canvas.width * .55, 0, 1.1, BRUSH_COUNT * 0.8, 1, grad2)
    ];

    // Helper functions for Aurora
    function deCasteljau (p0x, p0y, cp0x, cp0y, cp1x, cp1y, p1x, p1y, t) {
      let Ax = p0x + (t * (cp0x - p0x)), Ay = p0y + (t * (cp0y - p0y)),
          Bx = cp0x + (t * (cp1x - cp0x)), By = cp0y + (t * (cp1y - cp0y)),
          Cx = cp1x + (t * (p1x - cp1x)), Cy = cp1y + (t * (p1y - cp1y));
      let Dx = Ax + (t * (Bx - Ax)), Dy = Ay + (t * (By - Ay)),
          Ex = Bx + (t * (Cx - Bx)), Ey = By + (t * (Cy - By));
      return { x: Dx + (t * (Ex - Dx)), y: Dy + (t * (Ey - Dy)) };
    }

    function Curve(vpX, vpY, vpZ, epX, epY, epZ, brushCount, maxBrushAlpha, fill) {
        this.vanishingPoint = { x: vpX, y: vpY, z: vpZ };
        this.endPoint = { x: epX, y: epY, z: epZ };
        this.brushCount = brushCount;
        this.maxBrushAlpha = maxBrushAlpha;
        this.points = [new CurvePoint(vpX, vpY, vpZ, 0)];
        
        for (let i = 0; i < 9; i++) {
            let mod = (i + 1) / 10; mod *= mod;
            let x = vpX + mod * (epX - vpX);
            x += (Math.random() * 1.5 - 0.75) * (x - this.points[i].x);
            let y = vpY + mod * (epY - vpY);
            y += ((1.2 - mod) * (Math.random() * 3.5 - 1.75)) * (y - this.points[i].y);
            let z = mod * (epZ - vpZ) + vpZ;
            this.points.push(new CurvePoint(x, y, z, ((Math.random() * .33 + .33) * (x - this.points[i].x))));
        }
        this.points.push(new CurvePoint(epX, epY, epZ, 0));

        this.brushes = [];
        for (let i = 0; i < this.brushCount; i++) {
            let noScale = Math.random() < .01;
            this.brushes.push(new Brush(this, (i / this.brushCount) * (epZ - vpZ) + vpZ, noScale ? "rgba(200, 200, 220, 0.8)" : fill, noScale));
        }
    }
    
    Curve.prototype = {
        draw: function(ctx) { this.brushes.forEach(b => b.draw(ctx)); },
        update: function() { 
            this.points.forEach(p => p.updatePosition(mouseXPercentage, mouseYPercentage)); 
            this.brushes.forEach(b => b.updatePosition()); 
        },
        getPointAtZ: function(p) {
            if (p <= this.points[0].z) return this.points[0];
            if (p >= this.points[this.points.length - 1].z) return this.points[this.points.length - 1];
            let i = 0;
            for (; i < this.points.length; i++) { if (p <= this.points[i].z) break; }
            let t = (p - this.points[i-1].z) / (this.points[i].z - this.points[i-1].z);
            let cps0 = this.points[i-1].getCps(), cps1 = this.points[i].getCps();
            return deCasteljau(this.points[i-1].x, this.points[i-1].y, cps0[1].x, cps0[1].y, cps1[0].x, cps1[0].y, this.points[i].x, this.points[i].y, t);
        }
    };

    function CurvePoint(x, y, z, cpLength) {
        this.x = x; this.y = y; this.z = z; this.cpLength = cpLength;
        this.cpYOffset = Math.random() * cpLength - cpLength;
        this.xAnimTime = Math.random() * 6000 + 3000;
        this.xVariance = Math.max(Math.random() * z * 270, 15);
        this.xMin = x - this.xVariance / 2;
        this.xAnimOffset = Math.random() * Math.PI;
        this.yAnimTime = Math.random() * 6000 + 3000;
        this.yVariance = Math.max(Math.random() * z * 80, 15);
        this.yMin = y - this.yVariance / 2;
        this.yAnimOffset = Math.random() * Math.PI;
    }
    
    CurvePoint.prototype = {
        getCps: function() { return [{x: this.x - this.cpLength, y: this.y - this.cpYOffset}, {x: this.x + this.cpLength, y: this.y + this.cpYOffset}]; },
        updatePosition: function(mx, my) {
            let dt = Date.now() - (this.startTime || (this.startTime = Date.now()));
            this.x = this.xMin + (Math.sin((dt / this.xAnimTime) * Math.PI + this.xAnimOffset) * .5 + .5) * this.xVariance + this.z * (1 - mx * 2) * 50;
            this.y = this.yMin + (Math.sin((dt / this.yAnimTime) * Math.PI + this.yAnimOffset) * .5 + .5) * this.yVariance + this.z * (1 - my * 2) * 25;
        }
    };

    function Brush(curve, z, color, noScale) {
        this.curve = curve; this.z = z; this.color = color; this.noScale = noScale;
        this.alpha = z * Math.random() * .55 + .15;
        this.scaleYMod = 0.98 * Math.random();
        this.scaleXMod = .5 * Math.random() * (2 - this.scaleYMod * 2);
        this.alphaAnimTime = Math.random() * 5500 + 1500;
        this.alphaVariance = Math.max(Math.random() * .7, this.alpha);
        this.alphaMin = Math.max(this.alpha - this.alphaVariance / 2, 0);
        this.alphaAnimOffset = Math.random() * Math.PI;
        this.scaleYAnimTime = Math.random() * 5500 + 1500;
        this.scaleYVariance = Math.random() * .5;
        this.scaleYMin = this.scaleYMod - this.scaleYVariance / 2;
        this.scaleYAnimOffset = Math.random() * Math.PI;
        this.zAnimOffset = curve.vanishingPoint.z - (z - curve.vanishingPoint.z);
        this.zAnimTime = Math.random() * 22000 + 58000;
        if (noScale) { this.alphaMin = 0; this.alphaVariance = 1; }
    }
    
    Brush.prototype = {
        draw: function(ctx) {
            if (this.z < this.curve.vanishingPoint.z || this.z > this.curve.endPoint.z) return;
            let point = this.curve.getPointAtZ(this.z);
            let alpha = ((.5 + .5 * Math.min(this.z, 1)) * this.alpha * this.curve.maxBrushAlpha);
            if (this.z - this.curve.vanishingPoint.z < .07) alpha *= (this.z - this.curve.vanishingPoint.z) / .07;
            else if (this.curve.endPoint.z - this.z < .07) alpha *= (this.curve.endPoint.z - this.z) / .07;
            
            let scaleY = this.noScale ? this.scaleYMod + .02 : this.z * this.scaleYMod + .02;
            let scaleX = this.noScale ? this.scaleXMod + .5 : this.z * this.scaleXMod + .5;
            
            ctx.fillStyle = this.color; ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.moveTo(point.x, point.y - scaleY * 450);
            ctx.quadraticCurveTo(point.x + scaleX * 15, point.y - scaleY * 450, point.x + scaleX * 15, point.y);
            ctx.quadraticCurveTo(point.x + scaleX * 15, point.y + scaleY * 30, point.x, point.y + scaleX * 15);
            ctx.quadraticCurveTo(point.x - scaleX * 15, point.y + scaleY * 30, point.x - scaleX * 15, point.y);
            ctx.quadraticCurveTo(point.x - scaleX * 15, point.y - scaleY * 450, point.x, point.y - scaleY * 450);
            ctx.fill();
        },
        updatePosition: function() {
            let dt = Date.now() - (this.startTime || (this.startTime = Date.now() - 20000));
            this.alpha = Math.min(this.alphaMin + (Math.sin((dt/this.alphaAnimTime)*Math.PI + this.alphaAnimOffset)*.5+.5)*this.alphaVariance, 1);
            this.scaleY = this.scaleYMin + (Math.sin((dt/this.scaleYAnimTime)*Math.PI + this.scaleYAnimOffset)*.5+.5)*this.scaleYVariance;
            this.z = ((dt/this.zAnimTime) + this.zAnimOffset) * this.curve.endPoint.z;
            if (this.z > this.curve.vanishingPoint.z) this.z *= this.z;
            if (this.z > this.curve.endPoint.z) { this.z = (this.z - this.curve.endPoint.z) + this.curve.vanishingPoint.z; this.startTime = Date.now(); }
        }
    };

    // Track mouse dynamically for Aurora
    document.addEventListener('mousemove', e => {
      mouseXPercentage = e.clientX / window.innerWidth;
      mouseYPercentage = e.clientY / window.innerHeight;
    });

    // Render loop
    function renderAurora() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        curves.forEach(c => { c.update(); c.draw(ctx); });
        requestAnimationFrame(renderAurora);
    }
    renderAurora();
  }
  
  initAurora();

  /* ============================================
     DYNAMIC DENSITY STARFIELD & BRIDGES
  ============================================ */
  function buildStarfield() {
    const densityMultiplier = Math.max(0.5, window.innerWidth / 900);
    const isDesktop = window.innerWidth > 768;

    const layers = [
      { selector: '.layer-background', count: Math.floor(70 * densityMultiplier), sizeClass: 'star-size-capped', animClass: 'anim-slow-glow', bridges: Math.floor(15 * densityMultiplier) },
      { selector: '.layer-midground', count: Math.floor(70 * densityMultiplier), sizeClass: 'star-size-tiny', animClass: 'anim-fast-flicker', bridges: Math.floor(10 * densityMultiplier) },
      { selector: '.layer-foreground', count: Math.floor(35 * densityMultiplier), sizeClass: 'star-size-tiny', animClass: 'anim-fast-flicker', bridges: 0 }
    ];

    const starColors = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#e0ecff', '#ffebd6', '#ffd0b3'];

    layers.forEach(layer => {
      const container = document.querySelector(layer.selector);
      if (!container) return;
      
      const frag = document.createDocumentFragment();
      const coords = [];
      
      for (let i = 0; i < layer.count; i++) {
        const starWrapper = document.createElement('div');
        starWrapper.className = `star-glow-container ${layer.sizeClass} ${layer.animClass}`;
        
        const left = (Math.random() * 100);
        const top = (Math.random() * 100);
        const delay = (Math.random() * 4).toFixed(2);
        const color = starColors[Math.floor(Math.random() * starColors.length)];
        
        starWrapper.style.cssText = `left: ${left.toFixed(2)}%; top: ${top.toFixed(2)}%; animation-delay: ${delay}s; color: ${color}; filter: drop-shadow(0 0 5px ${color});`;
        
        const starCore = document.createElement('div');
        starCore.className = 'star-refined';
        starCore.style.backgroundColor = '#ffffff'; 
        
        starWrapper.appendChild(starCore);
        frag.appendChild(starWrapper);
        coords.push({x: left, y: top});
      }
      
      if (layer.bridges > 0) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; pointer-events: none;';
        
        let drawnLines = 0;
        for(let i = 0; i < coords.length; i++) {
            for(let j = i + 1; j < coords.length; j++) {
                let dx = coords[i].x - coords[j].x;
                let dy = coords[i].y - coords[j].y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 3 && dist < 12 && Math.random() > 0.75) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", coords[i].x + "%");
                    line.setAttribute("y1", coords[i].y + "%");
                    line.setAttribute("x2", coords[j].x + "%");
                    line.setAttribute("y2", coords[j].y + "%");
                    line.setAttribute("stroke", "rgba(255, 255, 255, 0.15)");
                    line.setAttribute("stroke-width", isDesktop ? "0.5" : "1");
                    svg.appendChild(line);
                    drawnLines++;
                }
                if (drawnLines >= layer.bridges) break;
            }
            if (drawnLines >= layer.bridges) break;
        }
        frag.appendChild(svg);
      }
      
      container.appendChild(frag);
    });
  }
  
  buildStarfield();

  /* ============================================
     PARALLAX (MOUSE)
  ============================================ */
  let pTicking = false;
  if (!reduceMotion) {
    document.addEventListener('mousemove', (e) => {
      if (!pTicking) {
        window.requestAnimationFrame(() => {
          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;
          const moveX = (e.clientX - centerX) / centerX;
          const moveY = (e.clientY - centerY) / centerY;
          const container = document.querySelector('.sky-parallax-container');
          
          if(container) {
            container.style.setProperty('--mx', moveX);
            container.style.setProperty('--my', moveY);
          }
          pTicking = false;
        });
        pTicking = true;
      }
    });
  }

  /* ============================================
     CINEMATIC ECLIPSE & LENS FLARE PHYSICS
  ============================================ */
  const root = document.documentElement;
  const moonCanvas = document.getElementById('moonCanvas');
  const heroWrap = document.getElementById('heroWrap');
  let sTicking = false;

  function updateEclipse() {
    sTicking = false;
    const scrollY = window.scrollY;
    
    // Set scroll property for mobile background parallax tracking
    root.style.setProperty('--scroll-y', scrollY);

    if (reduceMotion) return; 
    
    const totalScroll = Math.max(1, heroWrap.offsetHeight - window.innerHeight);
    const p = Math.min(1, Math.max(0, scrollY / totalScroll)); 
    
    const maxOffset = window.innerWidth <= 640 ? 120 : 250;
    
    let moonX = p * maxOffset; 
    let moonY = p * (maxOffset * 0.3); 

    let flareOp = 0;
    let bgFlare = 0;
    let auroraOp = 0;

    // Phase 1: Diamond Ring burst as the moon cracks the sun edge (0% to 15%)
    if (p > 0 && p < 0.15) {
        flareOp = p / 0.15; 
        auroraOp = p / 0.15; // Aurora starts blooming
    } 
    // Phase 2: Full Reveal (15% to 70%)
    else if (p >= 0.15 && p < 0.7) {
        flareOp = 1; 
        auroraOp = 1; // Aurora is fully visible while sun is out
    } 
    // Phase 3: Fade Out (70% to 100%) as we hit the dark gallery
    else if (p >= 0.7) {
        flareOp = Math.max(0, 1 - ((p - 0.7) / 0.3)); 
        auroraOp = Math.max(0, 1 - ((p - 0.7) / 0.3));
    }
    
    bgFlare = flareOp * 0.9; 

    // PHYSICS TRACKING
    const eclipseRect = document.querySelector('.eclipse-system').getBoundingClientRect();
    const viewportCenterX = window.innerWidth / 2;
    const viewportCenterY = window.innerHeight / 2;
    
    const sunCenterX = eclipseRect.left + eclipseRect.width / 2;
    const sunCenterY = eclipseRect.top + eclipseRect.height / 2;
    
    const lx = sunCenterX - viewportCenterX;
    const ly = sunCenterY - viewportCenterY;

    // Apply values to DOM layout engine
    root.style.setProperty('--flare-op', flareOp.toFixed(3));
    root.style.setProperty('--bg-flare', bgFlare.toFixed(3));
    root.style.setProperty('--aurora-op', auroraOp.toFixed(3));
    root.style.setProperty('--lx', lx + 'px');
    root.style.setProperty('--ly', ly + 'px');
    
    const textFade = Math.min(1, scrollY / 300);
    root.style.setProperty('--fade-text', textFade.toFixed(3));
    
    moonCanvas.style.transform = `translate3d(${moonX}px, ${moonY}px, 0)`;
  }

  window.addEventListener('scroll', () => {
    if (!sTicking) {
      window.requestAnimationFrame(updateEclipse);
      sTicking = true;
    }
  }, { passive: true });

  updateEclipse();

  /* ============================================
     GALLERY INJECTION & INTERSECTION OBSERVER
  ============================================ */
  const grid = document.getElementById('galleryGrid');
  const aspects = ['3/4', '1/1', '4/5', '4/3', '2/3'];
  const usingPlaceholders = photos.length === 0;
  const items = usingPlaceholders ? Array.from({ length: 6 }, () => null) : photos;

  items.forEach((photo, i) => {
    const frame = document.createElement('div');
    frame.className = 'frame' + (photo ? '' : ' frame--empty');

    if (photo) {
      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = photo.caption || 'A photo';
      img.loading = 'lazy';
      frame.appendChild(img);
      frame.addEventListener('click', () => openLightbox(i));
    } else {
      frame.style.setProperty('--ar', aspects[i % aspects.length]);
      frame.innerHTML = `
        <svg width="22" height="22" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="11.5" stroke="#8f8a97" stroke-width="1"/>
          <circle cx="13" cy="13" r="6" fill="#8f8a97"/>
        </svg>
        <span>awaiting</span>`;
    }
    grid.appendChild(frame);
  });

  if (reduceMotion) {
    document.querySelectorAll('.frame').forEach(f => f.classList.add('visible'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.frame').forEach(f => io.observe(f));
  }

  /* ============================================
     LIGHTBOX CONTROLLER
  ============================================ */
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCaption = document.getElementById('lbCaption');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');
  let currentIndex = 0;

  function openLightbox(index) {
    if (usingPlaceholders) return;
    currentIndex = index;
    showPhoto();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
  }

  function showPhoto() {
    const p = photos[currentIndex];
    lbImg.src = p.src;
    lbImg.alt = p.caption || '';
    lbCaption.textContent = p.caption || '';
    const multi = photos.length > 1;
    lbPrev.style.display = multi ? 'block' : 'none';
    lbNext.style.display = multi ? 'block' : 'none';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  lbPrev.addEventListener('click', () => { currentIndex = (currentIndex - 1 + photos.length) % photos.length; showPhoto(); });
  lbNext.addEventListener('click', () => { currentIndex = (currentIndex + 1) % photos.length; showPhoto(); });

  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbPrev.click();
    if (e.key === 'ArrowRight') lbNext.click();
  });

</script>
</body>
</html>
