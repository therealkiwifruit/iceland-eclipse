<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- STRICT DARK MODE ENFORCEMENT -->
<meta name="color-scheme" content="only dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Sarra - Eclipse 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================
     1. DESIGN TOKENS & CORE RESET
  ============================================ */
  :root {
    color-scheme: only dark; 
    --void: #000000;        
    --starlight: #eef0f7;   
    --muted: #8f8a97;       
    --hairline: rgba(238, 240, 247, 0.12);
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  html { 
    scroll-behavior: smooth; 
    width: 100%;
    overflow-x: hidden;
    background-color: var(--void); 
  }

  body {
    color: var(--starlight);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    min-height: 100vh;
  }

  ::selection { 
    background: #f2c879; 
    color: var(--void); 
  }

  /* ============================================
     2. DYNAMIC PARALLAX SKY BACKGROUND
  ============================================ */
  .sky-parallax-container {
    position: fixed;
    top: -15vh; 
    left: -10vw;
    width: 120vw;
    height: 130vh;
    background-color: var(--void); 
    overflow: hidden;
    z-index: 0; 
    pointer-events: none;
    perspective: 1000px;
  }

  .sky-light-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(30, 15, 65, 0.9) 0%, rgba(20, 5, 35, 0.5) 60%, transparent 100%);
    opacity: var(--bg-flare, 0); 
    will-change: opacity;
    z-index: 0;
  }

  .aurora-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: blur(50px);
    opacity: var(--aurora-op, 0); 
    will-change: opacity;
    mix-blend-mode: screen;
    z-index: 0;
  }

  .parallax-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform;
    z-index: 1;
  }

  .layer-background { transform: translate3d(calc(var(--mx, 0) * 10px), calc(var(--my, 0) * 10px - var(--scroll-y, 0) * 0.05px), 0); }
  .layer-midground { transform: translate3d(calc(var(--mx, 0) * 25px), calc(var(--my, 0) * 25px - var(--scroll-y, 0) * 0.15px), 0); }
  .layer-foreground { transform: translate3d(calc(var(--mx, 0) * 45px), calc(var(--my, 0) * 45px - var(--scroll-y, 0) * 0.35px), 0); }

  .star-glow-container {
    position: absolute;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 5px currentColor);
  }

  .star-refined {
    width: 100%;
    height: 100%;
    background-color: #ffffff; 
    box-shadow: 0 0 2px #ffffff;
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
  }
  
  .star-size-tiny { width: 3.5px; height: 3.5px; }
  .star-size-capped { width: 6.5px; height: 6.5px; }

  .anim-fast-flicker { animation: fastFlicker 0.9s infinite ease-in-out; }
  .anim-slow-glow { animation: slowGlow 4.5s infinite ease-in-out; }

  @keyframes fastFlicker {
    0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
    50% { opacity: 1.0; transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes slowGlow {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
    50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.05); }
  }

  /* ============================================
     3. MAIN FOREGROUND CONTENT WRAPPER
  ============================================ */
  .site-content {
    position: relative;
    z-index: 10; 
  }

  .hero-wrap {
    position: relative;
    height: 130vh;
  }

  .hero-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    background: transparent; 
  }

  /* 
     EXPLICIT ABSOLUTE POSITIONING
     Perfectly anchors the Sun, Text, and Scroll cues.
     They will not crash into each other.
  */
  .eclipse-system {
    position: absolute;
    top: 35%; /* Higher up for mobile */
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(45vmin, 340px);
    height: min(45vmin, 340px);
    z-index: 2;
  }

  .sun-canvas, .moon-canvas {
    position: absolute;
    inset: -1px;
    width: calc(100% + 2px);
    height: calc(100% + 2px);
    pointer-events: none;
  }

  .sun-canvas {
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    mix-blend-mode: screen;
    z-index: 1;
  }

  .moon-canvas {
    will-change: transform;
    transform: translate3d(0, 0, 0); 
    z-index: 2;
  }

  /* ============================================
     4. CANVAS LENS FLARE PHYSICS ENGINE
     All elements are immune to Samsung dark mode, but
     still use CSS variables to move perfectly!
  ============================================ */
  .flare-system {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 20;
    opacity: var(--flare-op, 0); 
    will-change: opacity;
  }

  .flare-artifact {
    position: absolute;
    top: 50%; left: 50%;
    will-change: transform;
    mix-blend-mode: screen;
    /* CSS controls the sliding motion perfectly */
    transform: translate(calc(-50% + var(--lx) * var(--scale)), calc(-50% + var(--ly) * var(--scale)));
  }

  .flare-streak {
    width: 3000px; height: 4px;
    --scale: 1; 
    transform: translate(calc(-50% + var(--lx) * var(--scale)), calc(-50% + var(--ly) * var(--scale))) rotate(-15deg);
  }

  .flare-burst { width: 250px; height: 250px; --scale: 1; }
  .flare-1 { width: 150px; height: 150px; --scale: -0.5; }
  .flare-2 { width: 300px; height: 300px; --scale: -1.2; }
  .flare-3 { width: 700px; height: 700px; --scale: -2.2; }
  .flare-4 { width: 120px; height: 120px; --scale: 0.8; }
  .flare-5 { width: 80px; height: 80px;  --scale: 0.3; }
  .flare-6 { width: 40px; height: 40px;  --scale: -0.2; }

  /* ============================================
     5. TYPOGRAPHY & UI POSITIONING
  ============================================ */
  .text-block {
    position: absolute;
    top: 66%; /* Sits cleanly between Sun and Scroll on Mobile */
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    text-align: center;
    padding: 0 24px;
    opacity: calc(1 - var(--fade-text, 0));
    will-change: opacity;
    z-index: 5; 
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .title {
    font-family: 'Jost', sans-serif;
    font-size: clamp(3.5rem, 11vw, 6.5rem);
    font-weight: 200; /* Ultra thin */
    letter-spacing: 0.15em; 
    line-height: 1;
    color: var(--starlight);
  }

  .tagline {
    margin-top: 12px;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .scroll-cue {
    position: absolute;
    bottom: 8vh; 
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: calc(1 - var(--fade-text, 0) * 3);
    color: var(--muted);
    z-index: 5;
  }

  .scroll-cue span {
    font-size: 0.75rem; 
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .scroll-cue .line {
    width: 1px;
    height: 32px;
    background: linear-gradient(var(--muted), transparent);
    animation: dropline 1.8s ease-in-out infinite;
  }

  @keyframes dropline {
    0%, 100% { transform: scaleY(0.3); transform-origin: top; opacity: 0.4; }
    50% { transform: scaleY(1); transform-origin: top; opacity: 1; }
  }

  /* DESKTOP MEDIA QUERY: Reposition elements for huge screens */
  @media (min-width: 768px) {
    .eclipse-system { top: 38%; }
    .text-block { top: 76%; } /* Push completely away from the giant corona */
    .scroll-cue { bottom: 4vh; }
  }

  /* ============================================
     6. GALLERY 
  ============================================ */
  .gallery {
    background: transparent; 
    padding: clamp(40px, 8vh, 80px) clamp(20px, 5vw, 48px) 40px;
  }

  .duo {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 48px) clamp(40px, 8vh, 76px);
    display: flex;
    gap: 22px;
  }

  .duo .frame { flex: 1; margin-bottom: 0; }
  .duo .frame.mirror { transform: translateY(24px) scaleX(-1); }
  .duo .frame.mirror.visible { transform: translateY(0) scaleX(-1); }

  .gallery-grid {
    columns: 3 300px;
    column-gap: 22px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .frame {
    break-inside: avoid;
    margin-bottom: 22px;
    border-radius: 10px;
    overflow: hidden;
    background: #1a1720;
    border: 1px solid var(--hairline);
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .frame.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
    cursor: zoom-in;
  }

  .frame:not(.frame--empty):hover {
    border-color: rgba(242, 200, 121, 0.4);
    box-shadow: 0 0 0 1px rgba(242, 200, 121, 0.15), 0 18px 40px rgba(0, 0, 0, 0.45);
    transform: translateY(-3px);
  }

  .frame--empty {
    aspect-ratio: var(--ar, 3/4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    border-style: dashed;
  }

  .frame--empty svg { opacity: 0.5; }
  .frame--empty span { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; }

  footer {
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 60px 24px 80px;
  }

  /* ============================================
     7. LIGHTBOX
  ============================================ */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
    padding: 40px;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 82vh;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
  }

  .lightbox figcaption {
    text-align: center;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute;
    background: transparent;
    border: none;
    color: var(--starlight);
    font-family: 'Jost', sans-serif;
    font-size: 1.6rem;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { opacity: 1; }
  .lightbox-close { top: 24px; right: 32px; font-size: 1.8rem; }
  .lightbox-prev { left: clamp(12px, 3vw, 40px); top: 50%; transform: translateY(-50%); font-size: 2.4rem; }
  .lightbox-next { right: clamp(12px, 3vw, 40px); top: 50%; transform: translateY(-50%); font-size: 2.4rem; }

  @media (max-width: 640px) {
    .duo { flex-direction: column; }
    .gallery-grid { columns: 1 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .parallax-layer { transition: none !important; transform: none !important; }
    .star-glow-container { animation: none !important; opacity: 0.8 !important; }
    .aurora-canvas { display: none !important; }
    .frame { transition: none !important; }
    .scroll-cue .line { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="sky-parallax-container">
      <div id="skyLightOverlay" class="sky-light-overlay"></div>
      <canvas id="auroraCanvas" class="aurora-canvas"></canvas>

      <div class="parallax-layer layer-background"></div>
      <div class="parallax-layer layer-midground"></div>
      <div class="parallax-layer layer-foreground"></div>
  </div>

  <main class="site-content">
    
    <!-- LENS FLARE SYSTEM: Converted to pure Canvas to defeat Samsung Dark Mode -->
    <div class="flare-system" id="flareSystem">
        <canvas id="flareStreak" class="flare-artifact flare-streak"></canvas>
        <canvas id="flareBurst" class="flare-artifact flare-burst"></canvas>
        <canvas id="flare1" class="flare-artifact flare-1"></canvas>
        <canvas id="flare2" class="flare-artifact flare-2"></canvas>
        <canvas id="flare3" class="flare-artifact flare-3"></canvas>
        <canvas id="flare4" class="flare-artifact flare-4"></canvas>
        <canvas id="flare5" class="flare-artifact flare-5"></canvas>
        <canvas id="flare6" class="flare-artifact flare-6"></canvas>
    </div>

    <section class="hero-wrap" id="heroWrap">
      <div class="hero-sticky" id="heroSticky">
        
        <div class="eclipse-system" id="eclipseSystem">
          <canvas id="sunCanvas" class="sun-canvas"></canvas>
          <canvas id="moonCanvas" class="moon-canvas"></canvas>
        </div>
        
        <!-- TEXT BLOCK: Absolute Positioned -->
        <div class="text-block">
          <p class="eyebrow">Iceland &middot; 2026</p>
          <h1 class="title">Sarra</h1>
          <p class="tagline">totality, and everything after</p>
        </div>
        
        <!-- SCROLL CUE: Absolute Positioned -->
        <div class="scroll-cue">
          <span>Scroll</span>
          <div class="line"></div>
        </div>

      </div>
    </section>

    <section class="gallery">
      <div class="duo">
        <div class="frame"><img src="images/duo-left.jpg" alt="" loading="lazy"></div>
        <div class="frame mirror"><img src="images/duo-right.jpg" alt="" loading="lazy"></div>
      </div>
    </section>

    <section class="gallery">
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <footer>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="11.5" stroke="#8f8a97" stroke-width="1"/>
        <circle cx="13" cy="13" r="6" fill="#8f8a97"/>
      </svg>
    </footer>

  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lightbox-prev" id="lbPrev" aria-label="Previous photo">&lsaquo;</button>
    <figure>
      <img id="lbImg" src="" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lightbox-next" id="lbNext" aria-label="Next photo">&rsaquo;</button>
  </div>

<script>
  const photos = [
    { src: "images/photo-01.jpg", caption: "" },
    { src: "images/photo-02.jpg", caption: "" },
    { src: "images/photo-03.jpg", caption: "" },
    { src: "images/photo-04.jpg", caption: "" },
    { src: "images/photo-05.jpg", caption: "" },
    { src: "images/photo-06.jpg", caption: "" },
    { src: "images/photo-07.jpg", caption: "" },
    { src: "images/photo-08.jpg", caption: "" },
    { src: "images/photo-09.jpg", caption: "" },
    { src: "images/photo-10.jpg", caption: "" },
    { src: "images/photo-11.jpg", caption: "" },
    { src: "images/photo-12.jpg", caption: "" },
    { src: "images/photo-13.jpg", caption: "" },
    { src: "images/photo-14.jpg", caption: "" },
    { src: "images/photo-15.jpg", caption: "" },
    { src: "images/photo-16.jpg", caption: "" },
    { src: "images/photo-17.jpg", caption: "" },
    { src: "images/photo-18.jpg", caption: "" }
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================
     DRAW LENS FLARES INTO CANVAS ELEMENTS
     This solves the Samsung Dark Mode override issue.
  ============================================ */
  function buildCanvasFlares() {
      function drawFlare(id, size, stops, isStreak = false) {
          const canvas = document.getElementById(id);
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          
          if (isStreak) {
              canvas.width = 3000; 
              canvas.height = 4;
              const grad = ctx.createLinearGradient(0, 0, 3000, 0);
              stops.forEach(s => grad.addColorStop(s[0], s[1]));
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, 3000, 4);
          } else {
              canvas.width = size; 
              canvas.height = size;
              const c = size / 2;
              const grad = ctx.createRadialGradient(c, c, 0, c, c, c);
              stops.forEach(s => grad.addColorStop(s[0], s[1]));
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, size, size);
          }
      }

      drawFlare('flareStreak', null, [
          [0, 'rgba(0,0,0,0)'], [0.4, 'rgba(255,220,180,0.1)'], [0.5, 'rgba(255,255,255,0.9)'], [0.6, 'rgba(255,220,180,0.1)'], [1, 'rgba(0,0,0,0)']
      ], true);

      drawFlare('flareBurst', 250, [[0, 'rgba(255,255,255,1)'], [0.15, 'rgba(255,200,100,0.6)'], [0.6, 'rgba(0,0,0,0)']]);
      drawFlare('flare1', 150, [[0.4, 'rgba(0,0,0,0)'], [0.5, 'rgba(190,190,240,0.2)'], [0.6, 'rgba(0,0,0,0)']]);
      drawFlare('flare2', 300, [[0.45, 'rgba(0,0,0,0)'], [0.5, 'rgba(200,230,200,0.15)'], [0.55, 'rgba(0,0,0,0)']]);
      drawFlare('flare3', 700, [[0.48, 'rgba(0,0,0,0)'], [0.5, 'rgba(255,50,50,0.1)'], [0.52, 'rgba(0,0,0,0)']]);
      drawFlare('flare4', 120, [[0.3, 'rgba(0,0,0,0)'], [0.5, 'rgba(50,180,50,0.2)'], [0.7, 'rgba(0,0,0,0)']]);
      drawFlare('flare5', 80, [[0, 'rgba(200,220,80,0.3)'], [0.6, 'rgba(0,0,0,0)']]);
      drawFlare('flare6', 40, [[0, 'rgba(150,220,220,0.4)'], [0.5, 'rgba(0,0,0,0)']]);
  }

  /* ============================================
     CANVAS ECLIPSE GENERATOR
  ============================================ */
  function drawEclipseElements() {
      const sunCanvas = document.getElementById('sunCanvas');
      if (!sunCanvas) return;
      const sCtx = sunCanvas.getContext('2d');
      const sSize = 800; 
      sunCanvas.width = sSize;
      sunCanvas.height = sSize;

      const sCx = sSize / 2;
      const sCy = sSize / 2;
      const sGrad = sCtx.createRadialGradient(sCx, sCy, 0, sCx, sCy, sSize / 2);

      sGrad.addColorStop(0, '#ffffff');
      sGrad.addColorStop(0.48, '#ffffff'); 
      sGrad.addColorStop(0.505, '#ffffff'); 
      sGrad.addColorStop(0.53, '#f2d299');  
      sGrad.addColorStop(0.58, '#e67345');  
      sGrad.addColorStop(0.70, 'rgba(80, 15, 20, 0.4)'); 
      sGrad.addColorStop(0.85, 'rgba(0, 0, 0, 0)');

      sCtx.fillStyle = sGrad;
      sCtx.fillRect(0, 0, sSize, sSize);

      const moonCanvas = document.getElementById('moonCanvas');
      if (!moonCanvas) return;
      const mCtx = moonCanvas.getContext('2d');
      const mSize = 400; 
      moonCanvas.width = mSize;
      moonCanvas.height = mSize;
      const mCx = mSize / 2;
      const mCy = mSize / 2;
      const mRadius = (mSize / 2) - 2; 

      mCtx.beginPath();
      mCtx.arc(mCx, mCy, mRadius, 0, 2 * Math.PI);
      mCtx.fillStyle = '#010002'; 
      mCtx.fill();

      mCtx.beginPath();
      mCtx.arc(mCx, mCy, mRadius, 0, 2 * Math.PI);
      mCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      mCtx.lineWidth = 2;
      mCtx.stroke();
  }

  /* ============================================
     LIVING CANVAS AURORA ENGINE
  ============================================ */
  function initAurora() {
      if (reduceMotion) return;
      const canvas = document.getElementById('auroraCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      let w, h;
      function resize() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      let t = 0;
      function draw() {
          ctx.clearRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'screen';
          
          let x1 = w * 0.3 + Math.sin(t * 0.5) * w * 0.2;
          let y1 = h * 0.6 + Math.cos(t * 0.3) * h * 0.2;
          let r1 = w * 0.4;
          let g1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, r1);
          g1.addColorStop(0, 'rgba(0, 240, 190, 0.4)');
          g1.addColorStop(1, 'rgba(0, 240, 190, 0)');
          ctx.fillStyle = g1;
          ctx.fillRect(0, 0, w, h);

          let x2 = w * 0.7 + Math.cos(t * 0.4) * w * 0.2;
          let y2 = h * 0.5 + Math.sin(t * 0.6) * h * 0.2;
          let r2 = w * 0.5;
          let g2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, r2);
          g2.addColorStop(0, 'rgba(210, 60, 180, 0.3)');
          g2.addColorStop(1, 'rgba(210, 60, 180, 0)');
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, w, h);

          let x3 = w * 0.5 + Math.sin(t * 0.2) * w * 0.3;
          let y3 = h * 0.8 + Math.cos(t * 0.5) * h * 0.1;
          let r3 = w * 0.6;
          let g3 = ctx.createRadialGradient(x3, y3, 0, x3, y3, r3);
          g3.addColorStop(0, 'rgba(20, 80, 160, 0.4)');
          g3.addColorStop(1, 'rgba(20, 80, 160, 0)');
          ctx.fillStyle = g3;
          ctx.fillRect(0, 0, w, h);

          t += 0.015;
          requestAnimationFrame(draw);
      }
      draw();
  }

  /* ============================================
     DYNAMIC DENSITY STARFIELD & BRIDGES
  ============================================ */
  function buildStarfield() {
    const densityMultiplier = Math.max(0.5, window.innerWidth / 900);
    const isDesktop = window.innerWidth > 768;

    const layers = [
      { selector: '.layer-background', count: Math.floor(70 * densityMultiplier), sizeClass: 'star-size-capped', animClass: 'anim-slow-glow', bridges: Math.floor(15 * densityMultiplier) },
      { selector: '.layer-midground', count: Math.floor(70 * densityMultiplier), sizeClass: 'star-size-tiny', animClass: 'anim-fast-flicker', bridges: Math.floor(10 * densityMultiplier) },
      { selector: '.layer-foreground', count: Math.floor(35 * densityMultiplier), sizeClass: 'star-size-tiny', animClass: 'anim-fast-flicker', bridges: 0 }
    ];

    const starColors = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#e0ecff', '#ffebd6', '#ffd0b3'];

    layers.forEach(layer => {
      const container = document.querySelector(layer.selector);
      if (!container) return;
      
      const frag = document.createDocumentFragment();
      const coords = [];
      
      for (let i = 0; i < layer.count; i++) {
        const starWrapper = document.createElement('div');
        starWrapper.className = `star-glow-container ${layer.sizeClass} ${layer.animClass}`;
        
        const left = (Math.random() * 100);
        const top = (Math.random() * 100);
        const delay = (Math.random() * 4).toFixed(2);
        const color = starColors[Math.floor(Math.random() * starColors.length)];
        
        starWrapper.style.cssText = `left: ${left.toFixed(2)}%; top: ${top.toFixed(2)}%; animation-delay: ${delay}s; color: ${color};`;
        
        const starCore = document.createElement('div');
        starCore.className = 'star-refined';
        
        starWrapper.appendChild(starCore);
        frag.appendChild(starWrapper);
        coords.push({x: left, y: top});
      }
      
      if (layer.bridges > 0) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; pointer-events: none;';
        
        let drawnLines = 0;
        for(let i = 0; i < coords.length; i++) {
            for(let j = i + 1; j < coords.length; j++) {
                let dx = coords[i].x - coords[j].x;
                let dy = coords[i].y - coords[j].y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 3 && dist < 12 && Math.random() > 0.75) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", coords[i].x + "%");
                    line.setAttribute("y1", coords[i].y + "%");
                    line.setAttribute("x2", coords[j].x + "%");
                    line.setAttribute("y2", coords[j].y + "%");
                    line.setAttribute("stroke", "rgba(255, 255, 255, 0.15)");
                    line.setAttribute("stroke-width", isDesktop ? "0.5" : "1");
                    svg.appendChild(line);
                    drawnLines++;
                }
                if (drawnLines >= layer.bridges) break;
            }
            if (drawnLines >= layer.bridges) break;
        }
        frag.appendChild(svg);
      }
      container.appendChild(frag);
    });
  }

  /* ============================================
     PARALLAX (MOUSE)
  ============================================ */
  let pTicking = false;
  if (!reduceMotion) {
    document.addEventListener('mousemove', (e) => {
      if (!pTicking) {
        window.requestAnimationFrame(() => {
          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;
          const moveX = (e.clientX - centerX) / centerX;
          const moveY = (e.clientY - centerY) / centerY;
          const container = document.querySelector('.sky-parallax-container');
          
          if(container) {
            container.style.setProperty('--mx', moveX);
            container.style.setProperty('--my', moveY);
          }
          pTicking = false;
        });
        pTicking = true;
      }
    });
  }

  /* ============================================
     CINEMATIC ECLIPSE & LENS FLARE PHYSICS
  ============================================ */
  const root = document.documentElement;
  const moonCanvas = document.getElementById('moonCanvas');
  const heroWrap = document.getElementById('heroWrap');
  let sTicking = false;

  function updateEclipse() {
    sTicking = false;
    const scrollY = window.scrollY;
    
    root.style.setProperty('--scroll-y', scrollY);

    if (reduceMotion) return; 
    
    const totalScroll = Math.max(1, heroWrap.offsetHeight - window.innerHeight);
    const p = Math.min(1, Math.max(0, scrollY / totalScroll)); 
    
    const maxOffset = window.innerWidth <= 640 ? 120 : 250;
    
    let moonX = p * maxOffset; 
    let moonY = p * (maxOffset * 0.3); 

    let flareOp = 0;
    let bgFlare = 0;
    let auroraOp = 0;

    if (p < 0.15) {
        flareOp = 0;
        auroraOp = 0;
    } else if (p >= 0.15 && p < 0.7) {
        flareOp = 1; 
        auroraOp = (p - 0.15) / 0.55; 
    } else if (p >= 0.7) {
        flareOp = Math.max(0, 1 - ((p - 0.7) / 0.3)); 
        auroraOp = 1; 
    }
    
    bgFlare = flareOp * 0.9; 

    // CALCULATE OPTICAL CENTER FOR LENS FLARES
    const eclipseSys = document.querySelector('.eclipse-system');
    if (eclipseSys) {
      const eclipseRect = eclipseSys.getBoundingClientRect();
      const viewportCenterX = window.innerWidth / 2;
      const viewportCenterY = window.innerHeight / 2;
      
      const sunCenterX = eclipseRect.left + eclipseRect.width / 2;
      const sunCenterY = eclipseRect.top + eclipseRect.height / 2;
      
      const lx = sunCenterX - viewportCenterX;
      const ly = sunCenterY - viewportCenterY;

      // Passing coordinates into CSS triggers the exact flare transform physics
      root.style.setProperty('--lx', lx + 'px');
      root.style.setProperty('--ly', ly + 'px');
    }

    root.style.setProperty('--flare-op', flareOp.toFixed(3));
    root.style.setProperty('--bg-flare', bgFlare.toFixed(3));
    root.style.setProperty('--aurora-op', auroraOp.toFixed(3));
    
    const textFade = Math.min(1, scrollY / 300);
    root.style.setProperty('--fade-text', textFade.toFixed(3));
    
    if (moonCanvas) {
      moonCanvas.style.transform = `translate3d(${moonX}px, ${moonY}px, 0)`;
    }
  }

  window.addEventListener('scroll', () => {
    if (!sTicking) {
      window.requestAnimationFrame(updateEclipse);
      sTicking = true;
    }
  }, { passive: true });
