<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- STRICT DARK MODE ENFORCEMENT: Prevents Samsung Internet from inverting colors -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Sarra - Eclipse 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================
     1. DESIGN TOKENS & CORE RESET
  ============================================ */
  :root {
    color-scheme: dark; /* Double enforcement for WebKit engines */
    --void: #000000;        
    --corona: #f2c879;      
    --ember: #ff8a5b;       
    --starlight: #eef0f7;   
    --muted: #8f8a97;       
    --hairline: rgba(238, 240, 247, 0.12);
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  html { 
    scroll-behavior: smooth; 
    width: 100%;
    overflow-x: hidden;
    background-color: var(--void); 
  }

  body {
    color: var(--starlight);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    min-height: 100vh;
  }

  ::selection { 
    background: var(--corona); 
    color: var(--void); 
  }

  /* ============================================
     2. DYNAMIC PARALLAX SKY BACKGROUND
  ============================================ */
  .sky-parallax-container {
    position: fixed;
    top: -15vh; 
    left: -10vw;
    width: 120vw;
    height: 130vh;
    background-color: var(--void); /* Pitch Black Start */
    overflow: hidden;
    z-index: 0; 
    pointer-events: none;
    perspective: 1000px;
  }

  .sky-light-overlay {
    position: absolute;
    inset: 0;
    /* Deep purple glow that fades in with the lens flare */
    background: linear-gradient(135deg, rgba(30, 15, 65, 0.9) 0%, rgba(20, 5, 35, 0.5) 60%, transparent 100%);
    opacity: var(--bg-flare, 0); 
    will-change: opacity;
    z-index: 0;
  }

  .parallax-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform;
    z-index: 1;
  }

  /* Incorporates Scroll-Y for mobile parallax without a mouse */
  .layer-background { transform: translate3d(calc(var(--mx, 0) * 10px), calc(var(--my, 0) * 10px - var(--scroll-y, 0) * 0.05px), 0); }
  .layer-midground { transform: translate3d(calc(var(--mx, 0) * 25px), calc(var(--my, 0) * 25px - var(--scroll-y, 0) * 0.15px), 0); }
  .layer-foreground { transform: translate3d(calc(var(--mx, 0) * 45px), calc(var(--my, 0) * 45px - var(--scroll-y, 0) * 0.35px), 0); }

  /* 
     STAR REFINEMENT: 
     Wrapper applies the colored drop-shadow. 
     Inner core is intensely white to look sharp and bright.
  */
  .star-glow-container {
    position: absolute;
    will-change: transform, opacity;
  }

  .star-refined {
    width: 100%;
    height: 100%;
    background-color: #ffffff; 
    box-shadow: 0 0 2px #ffffff;
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
  }
  
  .star-size-tiny { width: 3.5px; height: 3.5px; }
  .star-size-capped { width: 6.5px; height: 6.5px; }

  .anim-fast-flicker { animation: fastFlicker 0.9s infinite ease-in-out; }
  .anim-slow-glow { animation: slowGlow 4.5s infinite ease-in-out; }

  @keyframes fastFlicker {
    0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
    50% { opacity: 1.0; transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes slowGlow {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
    50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.05); }
  }

  /* ============================================
     3. MAIN FOREGROUND CONTENT WRAPPER
  ============================================ */
  .site-content {
    position: relative;
    z-index: 10; 
  }

  .hero-wrap {
    position: relative;
    height: 120vh; /* Reduced to eliminate the massive gap before gallery */
  }

  .hero-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent; 
  }

  .eclipse-system {
    position: relative;
    width: min(45vmin, 340px);
    height: min(45vmin, 340px);
    margin-bottom: clamp(28px, 5vh, 52px);
    z-index: 2;
  }

  /* TIGHT SVG CORONA - Identical across all mobile & desktop browsers */
  .sun-svg, .moon-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .moon-svg {
    will-change: transform;
    transform: translate3d(0, 0, 0); 
  }

  /* ============================================
     4. PHYSICS-ACCURATE LENS FLARE SYSTEM
     Translates along the center axis opposite the sun
  ============================================ */
  .flare-system {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 20;
    opacity: var(--flare-op, 0); 
    will-change: opacity;
  }

  .flare-artifact {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 9999px;
    will-change: transform;
    mix-blend-mode: screen;
  }

  /* Core burst of light tracked exactly to the exposed sun edge */
  .flare-burst {
    width: 0px; height: 0px;
    box-shadow: 0px 0px 30px 10px rgba(255,240,200,1), 0px 0px 10px 5px rgba(255,255,255,1);
    transform: translate(calc(-50% + var(--lx)), calc(-50% + var(--ly)));
  }

  /* Cinematic Anamorphic Streak */
  .flare-streak {
    width: 150vw; height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,220,180,0.1) 40%, rgba(255,255,255,0.9) 50%, rgba(255,220,180,0.1) 60%, transparent 100%);
    transform: translate(calc(-50% + var(--lx)), calc(-50% + var(--ly))) rotate(-15deg);
  }

  /* Ghost reflections traveling opposite direction along the optical axis */
  .flare-1 {
    width: 100px; height: 100px;
    box-shadow: inset 0px 0px 20px 2px rgba(190,190,240,0.125), 0px 0px 20px 0px rgba(190,190,240,0.125);
    transform: translate(calc(-50% + var(--lx) * -0.5), calc(-50% + var(--ly) * -0.5));
  }
  .flare-2 {
    width: 200px; height: 200px;
    box-shadow: inset 0px 0px 100px 2px rgba(200,230,200,0.125), 0px 0px 13px 2px rgba(200,230,200,0.125);
    transform: translate(calc(-50% + var(--lx) * -1.2), calc(-50% + var(--ly) * -1.2));
  }
  .flare-3 {
    width: 600px; height: 600px;
    box-shadow: inset 0px 0px 22px 2px rgba(255,50,50,0.15), 0px 0px 13px 2px rgba(255,50,50,0.15);
    transform: translate(calc(-50% + var(--lx) * -2.2), calc(-50% + var(--ly) * -2.2));
  }
  .flare-4 {
    width: 100px; height: 100px;
    box-shadow: inset 0px 0px 160px 2px rgba(50,180,50,0.125), 0px 0px 20px 2px rgba(50,180,50,0.125);
    transform: translate(calc(-50% + var(--lx) * 0.8), calc(-50% + var(--ly) * 0.8));
  }
  .flare-5 {
    width: 60px; height: 60px;
    box-shadow: inset 0px 0px 160px 2px rgba(200,220,80,0.25), 0px 0px 20px 2px rgba(200,220,80,0.25);
    transform: translate(calc(-50% + var(--lx) * 0.3), calc(-50% + var(--ly) * 0.3));
  }
  .flare-6 {
    width: 20px; height: 20px;
    box-shadow: inset 0px 0px 18px 10px rgba(150,220,220,0.25), 0px 0px 5px 0px rgba(150,220,220,0.25);
    transform: translate(calc(-50% + var(--lx) * -0.2), calc(-50% + var(--ly) * -0.2));
  }

  /* ============================================
     5. TYPOGRAPHY & UI
  ============================================ */
  .hero-text {
    text-align: center;
    padding: 0 24px;
    opacity: calc(1 - var(--fade-text, 0));
    will-change: opacity;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .title {
    font-family: 'Jost', sans-serif;
    font-size: clamp(3.5rem, 11vw, 6.5rem);
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 1;
    color: var(--starlight);
  }

  .tagline {
    margin-top: 16px;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .scroll-cue {
    position: absolute;
    bottom: 60px; 
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: calc(1 - var(--fade-text, 0) * 3);
    color: var(--muted);
  }

  .scroll-cue span {
    font-size: 0.75rem; 
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .scroll-cue .line {
    width: 1px;
    height: 32px;
    background: linear-gradient(var(--muted), transparent);
    animation: dropline 1.8s ease-in-out infinite;
  }

  @keyframes dropline {
    0%, 100% { transform: scaleY(0.3); transform-origin: top; opacity: 0.4; }
    50% { transform: scaleY(1);
